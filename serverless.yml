service: cost-flow

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x

  region: ${self:custom.appConfig.aws.region}
  stage: ${opt:stage, 'local'}

  environment:
    APP_ENV: ${sls:stage}
    NODE_ENV: ${self:custom.appConfig.app.nodeEnv}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:*:secret:${self:custom.appConfig.secrets.appSecretId}*

build:
  esbuild:
    bundle: true
    format: cjs

    external:
      - pg

    outExtension:
      '.js': '.cjs'

functions:
  health:
    handler: src/entrypoints/lambda/system/health.handler
    events:
      - http:
          path: health
          method: get

  createOrganization:
    handler: src/entrypoints/lambda/organization/create-organization.handler
    events:
      - http:
          path: organizations
          method: post

  findAllOrganizations:
    handler: src/entrypoints/lambda/organization/find-all-organization.handler
    events:
      - http:
          path: organizations
          method: get

  findOrganizationById:
    handler: src/entrypoints/lambda/organization/find-by-id-organization.handler
    events:
      - http:
          path: organizations/{id}
          method: get

  findOrganizationByName:
    handler: src/entrypoints/lambda/organization/find-by-name-organization.handler
    events:
      - http:
          path: organizations/name/{name}
          method: get

  updateOrganization:
    handler: src/entrypoints/lambda/organization/update-organization.handler
    events:
      - http:
          path: organizations/{id}
          method: put

  deleteOrganization:
    handler: src/entrypoints/lambda/organization/delete-organization.handler
    events:
      - http:
          path: organizations/{id}
          method: delete

  createUnit:
    handler: src/entrypoints/lambda/unit/create-unit.handler
    events:
      - http:
          path: organizations/{organizationId}/units
          method: post

  findAllUnits:
    handler: src/entrypoints/lambda/unit/find-all-units.handler
    events:
      - http:
          path: organizations/{organizationId}/units
          method: get

  findUnitById:
    handler: src/entrypoints/lambda/unit/find-by-id-unit.handler
    events:
      - http:
          path: organizations/{organizationId}/units/{id}
          method: get

  findUnitByName:
    handler: src/entrypoints/lambda/unit/find-by-name-unit.handler
    events:
      - http:
          path: organizations/{organizationId}/units/name/{name}
          method: get

  updateUnit:
    handler: src/entrypoints/lambda/unit/update-unit.handler
    events:
      - http:
          path: organizations/{organizationId}/units/{id}
          method: put

  deleteUnit:
    handler: src/entrypoints/lambda/unit/delete-unit.handler
    events:
      - http:
          path: organizations/{organizationId}/units/{id}
          method: delete

  createCostCenter:
    handler: src/entrypoints/lambda/cost-center/create-cost-center.handler
    events:
      - http:
          path: organizations/{organizationId}/units/{unitId}/cost-centers
          method: post

  findAllCostCenters:
    handler: src/entrypoints/lambda/cost-center/find-all-cost-centers.handler
    events:
      - http:
          path: organizations/{organizationId}/units/{unitId}/cost-centers
          method: get

  findCostCenterById:
    handler: src/entrypoints/lambda/cost-center/find-by-id-cost-center.handler
    events:
      - http:
          path: organizations/{organizationId}/units/{unitId}/cost-centers/{id}
          method: get

  findCostCenterByCode:
    handler: src/entrypoints/lambda/cost-center/find-by-code-cost-center.handler
    events:
      - http:
          path: organizations/{organizationId}/units/{unitId}/cost-centers/code/{code}
          method: get

  findCostCenterByName:
    handler: src/entrypoints/lambda/cost-center/find-by-name-cost-center.handler
    events:
      - http:
          path: organizations/{organizationId}/units/{unitId}/cost-centers/name/{name}
          method: get

  updateCostCenter:
    handler: src/entrypoints/lambda/cost-center/update-cost-center.handler
    events:
      - http:
          path: organizations/{organizationId}/units/{unitId}/cost-centers/{id}
          method: put

  deleteCostCenter:
    handler: src/entrypoints/lambda/cost-center/delete-cost-center.handler
    events:
      - http:
          path: organizations/{organizationId}/units/{unitId}/cost-centers/{id}
          method: delete

plugins:
  - serverless-localstack

custom:
  appConfig: ${file(./src/config/${sls:stage}.json)}

  localstack:
    stages:
      - local
